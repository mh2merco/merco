<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .inscription-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2d2d2d;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 11px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #45a049;
        }
        .success {
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }
        .error {
            color: #721c24;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="inscription-container">
        <h1>Inscription</h1>
        <div class="success" id="successMsg">Inscription enregistrée avec succès!</div>
        <div class="error" id="errorMsg">Veuillez remplir tous les champs.</div>
        
        <form id="inscriptionForm">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" required>

            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required>

            <label for="login">Login</label>
            <input type="text" id="login" name="login" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>

            <label for="profile">Profil</label>
            <select id="profile" name="profile" required>
                <option value="">Sélectionner un profil</option>
                <option value="etudiant">Étudiant</option>
                <option value="secretaire">Secrétaire</option>
                <option value="administrateur">Administrateur</option>
            </select>

            <label for="sexe">Sexe</label>
            <select id="sexe" name="sexe" required>
                <option value="">Sélectionner un sexe</option>
                <option value="masculin">Masculin</option>
                <option value="feminin">Féminin</option>
                <option value="autre">Autre</option>
            </select>

            <label for="nationalite">Nationalité</label>
            <select id="nationalite" name="nationalite" required>
                <option value="">Sélectionner une nationalité</option>
                <option value="senegalais">Sénégalais</option>
                <option value="malien">Malien</option>
                <option value="burkinabe">Burkinabé</option>
                <option value="ivoirien">Ivoirien</option>
                <option value="camerounais">Camerounais</option>
                <option value="autre">Autre</option>
            </select>

            <button type="submit">Enregistrer</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('inscriptionForm');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const prenom = document.getElementById('prenom').value.trim();
            const nom = document.getElementById('nom').value.trim();
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value.trim();
            const profile = document.getElementById('profile').value;
            const sexe = document.getElementById('sexe').value;
            const nationalite = document.getElementById('nationalite').value;

            if (!prenom || !nom || !login || !password || !profile || !sexe || !nationalite) {
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                return;
            }

            errorMsg.style.display = 'none';
            successMsg.style.display = 'block';
            form.reset();
            document.getElementById('prenom').focus();
        });
    </script>
</body>
</html>
